name: Generate PDF Catalog Automatically

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**/*.pdf'

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.x'

      - name: Generate catalog.json
        run: |
          python -c "
          import os, json

          catalog = {}
          for root, dirs, files in os.walk('.'):
              if '.git' in root or '.github' in root:
                  continue
              
              pdfs = [f for f in files if f.lower().endswith('.pdf')]
              if not pdfs:
                  continue
                  
              rel_path = os.path.relpath(root, '.')
              parts = rel_path.split(os.sep)
              
              if len(parts) == 4:
                  year, sem, subject, category = parts
                  catalog.setdefault(year, {}).setdefault(sem, {}).setdefault(subject, {})
                  
                  file_entries = []
                  for pdf in pdfs:
                      full_path = os.path.join(root, pdf)
                      web_path = os.path.relpath(full_path, '.').replace('\\\\', '/')
                      file_entries.append({
                          'name': pdf,
                          'path': web_path,
                          'size': os.path.getsize(full_path)
                      })
                  catalog[year][sem][subject][category.lower()] = file_entries

          with open('catalog.json', 'w', encoding='utf-8') as f:
              json.dump(catalog, f, indent=2, ensure_ascii=False)
          "

      - name: Commit and Push catalog.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update catalog.json [skip ci]" && git push)

      - name: Purge jsDelivr Cache
        run: |
          curl -i https://purge.jsdelivr.net/gh/khalid-os-creator/academic_pdf_storage@main/catalog.json
